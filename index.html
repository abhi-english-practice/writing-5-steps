 {name:'See',short:'See',title:'Say what you see',color:'#e7aa3e',pale:'#fff2d8',think:'Start with the main thing you can see. Tell the reader what the photo shows.',prompt:'What animal can you see? Where is it?',words:['This is','I can see','a red bird','sitting on','a wooden fence','in the photo','small','bright'],hint:'Name the bird first. Then say where it is. Try: This is + a/an + noun + place.',model:'This is a red bird sitting on a wooden fence.',why:'The first sentence tells the reader the main subject and where it is. The phrase “sitting on” connects the bird to the fence.',pattern:'This is + noun + verb-ing + place.',checks:[['Names the main subject',s=>/\bbird\b/i.test(s)],['Says something about the photo',s=>/\b(red|bird|fence|photo|sitting|on)\b/i.test(s)]]},
 {name:'Describe',short:'Describe',title:'Describe it',color:'#74957d',pale:'#e3ece3',think:'The reader now knows there is a bird. Help them see it. Add colors and name some parts of the bird.',prompt:'What colors do you see? Which parts of the bird can you name?',words:['It has','The bird has','bright','feathers','beak','orange','black','red','tail','small'],hint:'Use an adjective before the body part: bright red feathers. Add two or three details with commas and and.',model:'It has bright red feathers, a black face, and a small orange beak.',why:'“It” points back to the bird, so you do not need to repeat “the bird.” Three small details make the bird easy to imagine.',pattern:'It has + adjective + noun, + adjective + noun, and + adjective + noun.',checks:[['Uses a color word',s=>/\b(red|orange|black|bright|brown|gray|grey|green|white|yellow)\b/i.test(s)],['Names a bird body part',s=>/\b(feather|feathers|beak|wing|wings|tail|face|head|eyes?|breast)\b/i.test(s)]]},
 {name:'Place',short:'Place',title:'Show the place',color:'#db7463',pale:'#f8e3df',think:'Now zoom out. Look at what is around the bird. This helps the reader imagine the whole scene, not only the bird.',prompt:'Where is the bird? What do you see around it?',words:['The fence is','Behind the bird,','old','gray','green','leaves','behind','near','branches','wooden fence'],hint:'Name one background detail. Add a place word such as behind, on, near, or around.',model:'The fence is old and gray, and there are green leaves behind the bird.',why:'This sentence describes the background. “Behind” tells the reader where the leaves are; “and” joins two ideas.',pattern:'The + noun + is + adjective + and + adjective, and there are + adjective + noun + behind + noun.',checks:[['Uses a place word',s=>/\b(behind|on|near|around|beside|above|below|between|in front of|next to|under)\b/i.test(s)],['Names the surroundings',s=>/\b(fence|leaf|leaves|tree|branch|branches|wood|background|garden|plants?)\b/i.test(s)]]},
 {name:'Action',short:'Action',title:'Show what is happening',color:'#498ca3',pale:'#dfedf2',think:'A photo is one moment in time. Tell the reader what is happening in that moment. This gives the paragraph some life.',prompt:'What is the bird doing right now? Which way is it looking?',words:['The bird is','It is','standing','looking','sitting','still','quietly','to the right','on the fence'],hint:'Use am/is/are + a verb ending in -ing. You can connect two actions with and.',model:'The bird is standing still and looking to the right.',why:'Two -ing verbs, “standing” and “looking,” show the moment in the photo. “And” joins them smoothly.',pattern:'The + noun + is + verb-ing + and + verb-ing + direction.',checks:[['Uses a verb ending in -ing',s=>/\b\w+ing\b/i.test(s)],['Names who is doing the action',s=>/\b(bird|it|cardinal)\b/i.test(s)]]},
 {name:'Feel',short:'Feel',title:'Say what you think',color:'#986db2',pale:'#eee5f3',think:'A paragraph needs an ending. Do not just add more facts. Say what you think or feel, and give a reason.',prompt:'How does this photo make you feel? Give one reason.',words:['I like this photo because','This photo makes me feel','beautiful','peaceful','because','nature','happy','special','looks','bright'],hint:'Use I like this photo because + reason, or This photo makes me feel + feeling + because + reason.',model:'I like this photo because the red bird looks bright and beautiful.',why:'The last sentence finishes the paragraph with an opinion. “Because” connects that opinion to a reason.',pattern:'I like this photo because + reason.',checks:[['Shares an opinion or feeling',s=>/\b(like|love|feel|beautiful|happy|peaceful|special|calm|amazing|pretty)\b/i.test(s)],['Gives a reason with because',s=>/\bbecause\b/i.test(s)]]}

case 'drillhint':state.drillHint=!state.drillHint;render();break;
case 'drillanswer':state.drillAnswer=!state.drillAnswer;render();break;
case 'drillclear':state.drillSelected=[];state.drillTyped='';state.drillNotice='';state.chunkBanks[state.drill]=shuffled(CHUNKS[state.drill].map((text,id)=>({text,id})));render();break;
case 'drillnext':switchDrill((state.drill+1)%5);break;
case 'drillcheck':{const i=state.drill;const candidate=state.drillMode==='chunks'?state.drillSelected.map(id=>CHUNKS[i][id]).join(' '):state.drillTyped.trim();if(!candidate){state.drillNotice='Add some chunks or write a sentence before checking.';render();break}const ok=candidate===STAGES[i].model;if(ok){if(!state.drillPass.includes(i))state.drillPass.push(i);state.drillNotice='Excellent. Your sentence matches the original model exactly.';}else state.drillNotice='Not the exact model yet. Check the order, wording, capital letter, and final punctuation. Other versions may still be grammatical.';render();break}
case 'cardprev':nextCard(-1);break;
case 'cardnext':nextCard(1);break;
case 'cardflip':state.cardFlip=!state.cardFlip;render();break;
case 'markreview':if(state.review.has(state.card))state.review.delete(state.card);else state.review.add(state.card);render();break;
case 'markremember':state.review.delete(state.card);if(state.cardsFilter&&visibleCards().length===0)state.cardsFilter=false;nextCard(1);break;
case 'shufflecards':state.cardOrder=shuffled(state.cardOrder.map((id,i)=>({id,i}))).map(o=>o.id);state.cardFlip=false;render();break;
case 'resetcards':state.review.clear();state.cardOrder=WORDS.map((_,i)=>i);state.cardsFilter=false;state.card=0;state.cardFlip=false;render();break;
case 'filterall':state.cardsFilter=false;render();break;
case 'filterreview':state.cardsFilter=true;render();break;
case 'cardsent':state.drill=WORDS[state.card].step;state.drillSelected=[];state.drillNotice='';state.drillHint=false;state.drillAnswer=false;goto('drill');break;
}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){goto(nav.dataset.nav);return}const step=e.target.closest('[data-step]');if(step){saveEntry();setStep(Number(step.dataset.step));return}const chip=e.target.closest('[data-chip]');if(chip){appendChip(Number(chip.dataset.chip));return}const dr=e.target.closest('[data-drill]');if(dr){switchDrill(Number(dr.dataset.drill));return}const ch=e.target.closest('[data-chunk]');if(ch){const id=Number(ch.dataset.chunk);if(!state.drillSelected.includes(id))state.drillSelected.push(id);state.drillNotice='';render();return}const un=e.target.closest('[data-unchunk]');if(un){state.drillSelected.splice(Number(un.dataset.unchunk),1);state.drillNotice='';render();return}const cs=e.target.closest('[data-selectcard]');if(cs){state.card=Number(cs.dataset.selectcard);state.cardFlip=false;render();return}const jump=e.target.closest('[data-cardjump]');if(jump){state.card=Number(jump.dataset.cardjump);state.cardFlip=false;goto('cards');return}if(e.target.closest('#flashcard')){state.cardFlip=!state.cardFlip;render();return}const a=e.target.closest('[data-action]');if(a)handleAction(a.dataset.action)});
document.addEventListener('input',e=>{if(e.target.id==='entry'){saveEntry();updateWordcount()}if(e.target.id==='recall')state.drillTyped=e.target.value});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='flashcard'){e.preventDefault();state.cardFlip=!state.cardFlip;render()}});
render();
</script>
</body></html>
